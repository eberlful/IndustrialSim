schema_version: "1.0"
seed: 42

episode:
  start_time: "0s"
  end_condition:
    type: "all_units_terminal"

plant:
  id: "plant-1"
  name: "Assembly Plant"
  areas:
    - id: "area-1"
      name: "Main Area"
      halls:
        - id: "hall-1"
          name: "Main Hall"

material_flow:
  nodes:
    - id: "src-1"
      kind: "source"
      hall_id: "hall-1"
      output_ports:
        - id: "p-out"
          port_type: "vehicle"
          direction: "output"
    - id: "st-1"
      kind: "station"
      hall_id: "hall-1"
      output_capacity: 0
      operations:
        - id: "op-fast"
          duration: "2s"
      input_ports:
        - id: "p-in"
          port_type: "vehicle"
          direction: "input"
      output_ports:
        - id: "p-out"
          port_type: "vehicle"
          direction: "output"
    - id: "buf-1"
      kind: "buffer"
      hall_id: "hall-1"
      capacity: 1
      input_ports:
        - id: "p-in"
          port_type: "vehicle"
          direction: "input"
      output_ports:
        - id: "p-out"
          port_type: "vehicle"
          direction: "output"
    - id: "st-2"
      kind: "station"
      hall_id: "hall-1"
      output_capacity: 0
      operations:
        - id: "op-slow"
          duration: "10s"
      input_ports:
        - id: "p-in"
          port_type: "vehicle"
          direction: "input"
      output_ports:
        - id: "p-out"
          port_type: "vehicle"
          direction: "output"
    - id: "snk-1"
      kind: "sink"
      hall_id: "hall-1"
      input_ports:
        - id: "p-in"
          port_type: "vehicle"
          direction: "input"
  routes:
    - id: "r-src-st1"
      source_node_id: "src-1"
      source_port_id: "p-out"
      target_node_id: "st-1"
      target_port_id: "p-in"
    - id: "r-st1-buf"
      source_node_id: "st-1"
      source_port_id: "p-out"
      target_node_id: "buf-1"
      target_port_id: "p-in"
    - id: "r-buf-st2"
      source_node_id: "buf-1"
      source_port_id: "p-out"
      target_node_id: "st-2"
      target_port_id: "p-in"
    - id: "r-st2-snk"
      source_node_id: "st-2"
      source_port_id: "p-out"
      target_node_id: "snk-1"
      target_port_id: "p-in"

production_units:
  - id: "unit-1"
    variant: "sedan"
    release_time: "0s"
  - id: "unit-2"
    variant: "sedan"
    release_time: "0s"
  - id: "unit-3"
    variant: "sedan"
    release_time: "0s"
