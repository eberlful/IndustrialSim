[project]
name = "industrialsim"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Markus Eberl", email = "markus.eberl@hotmail.com" }
]
requires-python = ">=3.14, <3.15"
dependencies = [
    "pyarrow>=25.0.1",
    "pydantic>=2.13.5",
    "ruamel-yaml>=0.18.10",
]

[project.scripts]
industrialsim = "industrialsim:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
"exclude-newer" = "3d"

[dependency-groups]
dev = [
    "hypothesis>=6.168.0",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
]

[[tool.mypy.overrides]]
module = [
    "pyarrow",
    "pyarrow.*",
]
ignore_missing_imports = true

